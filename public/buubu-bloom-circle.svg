<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&amp;display=swap');
      .buubu-text {
        font-family: 'Fredoka', 'Quicksand', 'Nunito', system-ui, -apple-system, sans-serif;
        font-weight: 700;
      }
    </style>
  </defs>
  <!-- Soft background circle -->
  <circle cx="80" cy="80" r="78" fill="#FFFFFF" stroke="#E4EEF2" stroke-width="2"/>
  
  <!-- Buubu line -->
  <text x="28" y="68" class="buubu-text" font-size="34" fill="#123B68" letter-spacing="-0.5">Buubu</text>
  
  <!-- Bloom line with orange second 'o' -->
  <text x="28" y="102" class="buubu-text" font-size="34" letter-spacing="-0.5">
    <tspan fill="#123B68">Bl</tspan><tspan fill="#123B68">o</tspan><tspan fill="#F58220">o</tspan><tspan fill="#123B68">m</tspan>
  </text>
  
  <!-- Teal smile arc underneath Bloom -->
  <path d="M 64 109 C 72 117, 94 117, 102 109" stroke="#27AFA5" stroke-width="3.8" stroke-linecap="round" fill="none"/>
</svg>